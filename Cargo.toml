[workspace]
members = [
  "crates/unity-core",
  "crates/unity-hub",
  "crates/unity-hub-controller",
  "crates/unity-hub-model",
  "crates/unity-hub-ui",
]
default-members = ["crates/unity-hub"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
