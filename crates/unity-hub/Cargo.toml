[package]
name = "unity-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native iced desktop UI for the Unity CLI"
publish = false

[[bin]]
name = "unity-rust-hub"
path = "src/main.rs"

[dependencies]
futures = "0.3"
iced = { version = "0.14", default-features = false, features = [
  "crisp",
  "image",
  "linux-theme-detection",
  "thread-pool",
  "tiny-skia",
  "wayland",
  "x11",
] }
unity-hub-controller = { path = "../unity-hub-controller" }
unity-hub-model = { path = "../unity-hub-model" }
unity-hub-ui = { path = "../unity-hub-ui" }
