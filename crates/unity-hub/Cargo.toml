[package]
name = "unity-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native iced desktop UI for the Unity CLI"
publish = false

[[bin]]
name = "unity-rust-hub"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures = "0.3"
iced = { version = "0.14", default-features = false, features = [
  "crisp",
  "thread-pool",
  "tiny-skia",
  "wayland",
  "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unity-core = { path = "../unity-core" }
