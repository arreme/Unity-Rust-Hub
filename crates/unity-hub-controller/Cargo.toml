[package]
name = "unity-hub-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "State, CLI orchestration, jobs, and view-model mapping for Unity Rust Hub"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures = "0.3"
iced = { version = "0.14", default-features = false, features = ["thread-pool", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unity-core = { path = "../unity-core" }
unity-hub-model = { path = "../unity-hub-model" }
