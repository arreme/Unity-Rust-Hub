[package]
name = "unity-hub-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Visual layer and design system for Unity Rust Hub"
publish = false

[[bin]]
name = "unity-hub-design-gallery"
path = "src/bin/gallery.rs"

[features]
# GPU rendering through iced's `wgpu` backend. The binary turns it on by
# default; building without it produces the software-only (`tiny-skia`) build.
gpu = ["iced/wgpu"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "crisp",
  "thread-pool",
  "tiny-skia",
  "wayland",
  "x11",
] }
unity-hub-model = { path = "../unity-hub-model" }
